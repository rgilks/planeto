name = "planeto"
main = "worker/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# The static Next export (output: 'export') is served from the same Worker.
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/events", "/api/room"]

# Shared multiplayer state + SSE fan-out, one instance per room
# (idFromName "room-N"); each is evicted automatically once no browser is
# connected to it.
[[durable_objects.bindings]]
name = "EVENTS"
class_name = "EventsChannel"

# Per-IP rate limiter for the public /api endpoints. One instance per client IP
# holds the authoritative request count, so the limit holds across isolates/colos
# instead of resetting per isolate.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Assigns each new client to the lowest non-full room and tracks occupancy.
# A single global instance (idFromName "director").
[[durable_objects.bindings]]
name = "ROOM_DIRECTOR"
class_name = "RoomDirector"

[[migrations]]
tag = "v1"
new_classes = ["EventsChannel"]

[[migrations]]
tag = "v2"
new_classes = ["RateLimiter"]

[[migrations]]
tag = "v3"
new_classes = ["RoomDirector"]

[[routes]]
pattern = "planeto.tre.systems"
custom_domain = true

[observability]
enabled = true
